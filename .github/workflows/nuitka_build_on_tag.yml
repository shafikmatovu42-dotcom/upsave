name: Build Nuitka on Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Dependency Walker (non-interactive)
        run: |
          choco install dependencywalker -y --no-progress
        shell: powershell

      - name: Run Nuitka build
        run: |
          python -m nuitka --standalone --jobs=2 --output-dir=build --show-progress --remove-output \
            --include-package=streamlit --include-package=pandas --include-package=fpdf run_app.py
        shell: powershell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-build-${{ github.ref_name }}
          path: build
